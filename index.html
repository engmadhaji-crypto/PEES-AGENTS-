 const imp=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=async()=>{try{let o=JSON.parse(String(r.result).replace(/^\uFEFF/,''));

  const d=o.customers?fromOrig(o):o;if(!d||!Array.isArray(d.clients))throw 0;const m=migrate(d),errs=checkData(m).filter(x=>x.l==='err').length;
